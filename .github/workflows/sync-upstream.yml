name: Sync Upstream
on:
  schedule:
    # 每天 UTC 时间 00:00 自动执行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击触发
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Upstream
        uses: zhangnew/sync-upstream@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
